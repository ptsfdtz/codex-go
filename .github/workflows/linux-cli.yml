name: AgentDeck Linux CLI

on:
  push:
    branches: [release]
    paths:
      - 'desktop/core/**'
      - 'packages/connection-protocol/**'
      - '.github/workflows/linux-cli.yml'
  pull_request:
    paths:
      - 'desktop/core/**'
      - 'packages/connection-protocol/**'
      - '.github/workflows/linux-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml --check
      - run: cargo check --locked --manifest-path desktop/core/Cargo.toml --bins
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml --lib
      - run: cargo build --release --locked --manifest-path desktop/core/Cargo.toml --bin agentdeck --bin agentdeck-service
      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-linux-x64
          path: |
            desktop/core/target/release/agentdeck
            desktop/core/target/release/agentdeck-service
            desktop/core/systemd/agentdeck.service

name: Release

on:
  push:
    branches: [release]
    tags: ['*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require tags to belong to release
        if: github.ref_type == 'tag'
        run: |
          git fetch origin release
          git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/release

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          tag="pre-${RUN_NUMBER}-${RUN_ATTEMPT}"
          flags=(--prerelease --latest=false)
          if [[ "$SOURCE_REF_TYPE" == tag ]]; then
            tag="$SOURCE_REF_NAME"
            flags=(--latest)
          fi
          cd release-assets
          version="host-${SOURCE_SHA}"
          test -s "releases/$version/agentdeck-windows-x64.zip"
          test -s "releases/$version/agentdeck-linux-x64.tar.gz"
          test -s "releases/$version/agentdeck-linux-arm64.tar.gz"
          test -s AgentDeck-android-debug.apk
          tar -czf agentdeck-downloads.tar.gz install.sh install.ps1 install-codex.ps1 releases
          cp releases/"$version"/*.zip releases/"$version"/*.tar.gz .
          sha256sum *.zip *.tar.gz *.apk > SHA256SUMS.txt
          cat > ../release-notes.md <<EOF
          AgentDeck 阶段测试版，尚未完成 Codex 全功能迁移。

          - Windows x64：Host ZIP 与 start.ps1，终端登录和后台运行，不需要 WebView2。
          - Linux x64 / ARM64：Host tar.gz；执行任务仍需配置经过验证的本机 Codex 运行时。ARM64 构建基于 Ubuntu 24.04。
          - agentdeck-downloads.tar.gz：可部署到同域静态下载目录，包含安装脚本、版本包和校验值。
          - Android：debug.apk 可直接安装，使用 CI 临时 debug 签名；不同构建或本地安装之间可能无法覆盖升级，卸载会清除本地数据。正式签名尚未配置。
          - SHA256SUMS.txt：下载文件的 SHA-256 校验值。

          源码提交：${SOURCE_SHA}
          应用内部版本号仍由源码构建配置决定，发布标签不自动修改版本号。
          EOF
          gh release create "$tag" --target "$SOURCE_SHA" "${flags[@]}" \
            --title "AgentDeck $tag" --notes-file ../release-notes.md \
            agentdeck-windows-x64.zip agentdeck-linux-x64.tar.gz agentdeck-linux-arm64.tar.gz agentdeck-downloads.tar.gz \
            AgentDeck-android-debug.apk SHA256SUMS.txt

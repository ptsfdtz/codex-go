name: Prepare candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public version X.Y.Z (build once, test, then promote)'
        required: true
        type: string
      notes:
        description: 'User-facing changes and upgrade notes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release branch and unused version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/release
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ! git rev-parse --verify "refs/tags/candidate-$VERSION"
          ! git rev-parse --verify "refs/tags/v$VERSION"
      - run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

  build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  cloud:
    needs: validate
    uses: ./.github/workflows/cloud.yml
    secrets: inherit

  candidate:
    needs: [build, cloud]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@v4
        with:
          name: agentdeck-cloud-linux-x64
          path: cloud-artifact
      - name: Seal candidate
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          cp cloud-artifact/agentdeck-cloud candidate/agentdeck-cloud
          cp scripts/release/gate.py candidate/release-gate.py
          python3 -c 'import os,pathlib; pathlib.Path("candidate-notes.txt").write_text(os.environ["RELEASE_NOTES"], encoding="utf-8")'
          python3 scripts/release/gate.py manifest candidate --version "$VERSION" --commit "$GITHUB_SHA" --notes-file candidate-notes.txt
          tar -czf candidate.tar.gz -C candidate .
          sha256sum candidate.tar.gz > candidate.tar.gz.sha256
          printf 'Candidate %s\n\nCommit: %s\nRequires Windows x64, Linux x64 and Linux ARM64 real E2E attestations before promotion.\n' "$VERSION" "$GITHUB_SHA" > candidate-notes.md
          cat candidate-notes.txt >> candidate-notes.md
          gh release create "candidate-$VERSION" --target "$GITHUB_SHA" --prerelease --latest=false --title "AgentDeck $VERSION candidate" --notes-file candidate-notes.md candidate.tar.gz candidate.tar.gz.sha256

  stage:
    needs: candidate
    runs-on: ubuntu-latest
    environment: candidate
    steps:
      - uses: actions/checkout@v4
      - name: Stage immutable packages for real update E2E
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.AGENTDECK_DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.AGENTDECK_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.AGENTDECK_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          gh release download "candidate-$VERSION" --pattern candidate.tar.gz --pattern candidate.tar.gz.sha256
          sha256sum -c candidate.tar.gz.sha256
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          remote_dir=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" 'mktemp -d /var/tmp/agentdeck-publish.XXXXXXXX')
          [[ "$remote_dir" =~ ^/var/tmp/agentdeck-publish\.[a-zA-Z0-9]+$ ]]
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes candidate.tar.gz scripts/release/stage-candidate.sh scripts/release/extract.py scripts/release/gate.py "$DEPLOY_HOST:$remote_dir/"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_HOST" "sh '$remote_dir/stage-candidate.sh' '$remote_dir'"

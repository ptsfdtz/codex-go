name: Cloud service
on:
  push:
    branches: [release]
    paths: ['server/**', 'packages/connection-protocol/**', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['server/**', 'packages/connection-protocol/**', '.github/workflows/cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binary:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked --manifest-path server/Cargo.toml --bin agentdeck-cloud
      - run: sha256sum server/target/release/agentdeck-cloud > server/target/release/agentdeck-cloud.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-cloud-linux-x64
          path: |
            server/target/release/agentdeck-cloud
            server/target/release/agentdeck-cloud.sha256
  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: agentdeck_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentdeck_test -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      AGENTDECK_TEST_DATABASE_URL: postgres://agentdeck_test:local-ci-only@127.0.0.1:5432/postgres
      AGENTDECK_TEST_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentdeck/web exec playwright install --with-deps chromium
      - name: Install matching PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml
      - run: cargo test --locked --manifest-path server/Cargo.toml --test cloud -- --ignored --test-threads=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-admin-browser
          path: artifacts/cloud-admin
          if-no-files-found: ignore
      - run: docker build -f server/Dockerfile -t agentdeck-cloud:check .

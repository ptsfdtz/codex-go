name: Cloud service
on:
  push:
    branches: [release]
    paths: ['server/**', 'packages/connection-protocol/**', '.github/workflows/cloud.yml']
  pull_request:
    paths: ['server/**', 'packages/connection-protocol/**', '.github/workflows/cloud.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file server/Cargo.lock --deny warnings
  binary:
    needs: [cloud, audit]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --locked --manifest-path server/Cargo.toml --bin agentdeck-cloud
      - run: sha256sum server/target/release/agentdeck-cloud > server/target/release/agentdeck-cloud.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: agentdeck-cloud-linux-x64
          path: |
            server/target/release/agentdeck-cloud
            server/target/release/agentdeck-cloud.sha256
  cloud:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: agentdeck_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: agentdeck_security_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U agentdeck_test -d agentdeck_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --manifest-path server/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path server/Cargo.toml --all-targets -- --include-ignored
        env:
          AGENTDECK_TEST_DATABASE_URL: postgres://agentdeck_test:disposable-ci-only@127.0.0.1:5432/agentdeck_security_test
      - run: docker build -f server/Dockerfile -t agentdeck-cloud:check .

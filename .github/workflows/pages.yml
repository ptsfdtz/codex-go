name: AgentDeck Web Pages

on:
  push:
    branches: [release]
    paths:
      - 'web/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentdeck/web test
      - run: pnpm --filter @agentdeck/desktop exec playwright install --with-deps chromium
      - run: node web/tests/browser-transport.mjs
      - name: Require cloud origin variable
        env:
          CLOUD_ORIGIN: ${{ vars.AGENTDECK_CLOUD_ORIGIN }}
        run: test -n "$CLOUD_ORIGIN"
      - run: pnpm --filter @agentdeck/web build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_CLOUD_ORIGIN: ${{ vars.AGENTDECK_CLOUD_ORIGIN }}
      - name: Add SPA fallback
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

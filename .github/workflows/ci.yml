name: AgentDeck CI
on:
  push:
    branches: ['**']
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  host-windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: desktop/core
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm schema:verify
      - run: pnpm audit --prod
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: 'cargo test --locked --manifest-path desktop/core/Cargo.toml --lib host::'
      - run: pnpm --filter @agentdeck/web build
        env:
          VITE_CLOUD_ORIGIN: ${{ vars.AGENTDECK_CLOUD_ORIGIN }}
      - run: tar -czf web.tar.gz -C web/dist .
      - name: Build Pages candidate
        if: inputs.version != ''
        shell: bash
        run: |
          test -n "$VITE_CLOUD_ORIGIN"
          export VITE_BASE_PATH="/${GITHUB_REPOSITORY#*/}/"
          pnpm --filter @agentdeck/web build
          cp web/dist/index.html web/dist/404.html
          tar -czf pages.tar.gz -C web/dist .
        env:
          VITE_CLOUD_ORIGIN: ${{ vars.AGENTDECK_CLOUD_ORIGIN }}
      - uses: actions/upload-artifact@v4
        if: inputs.version != ''
        with:
          name: release-web
          path: |
            web.tar.gz
            pages.tar.gz
          if-no-files-found: error
      - run: pnpm host:package
        env:
          AGENTDECK_RELEASE_VERSION: ${{ inputs.version || format('host-{0}', github.sha) }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/host-downloads/
          if-no-files-found: error
  host-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core
      - run: sh -n scripts/host/install.sh scripts/host/start.sh
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: 'cargo test --locked --manifest-path desktop/core/Cargo.toml --lib host::'
      - run: node scripts/host/package.mjs
        env:
          AGENTDECK_RELEASE_VERSION: ${{ inputs.version || format('host-{0}', github.sha) }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: artifacts/host-downloads/
          if-no-files-found: error
  host-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core
      - run: sh -n scripts/host/install.sh scripts/host/start.sh
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: node scripts/host/package.mjs
        env:
          AGENTDECK_RELEASE_VERSION: ${{ inputs.version || format('host-{0}', github.sha) }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/host-downloads/
          if-no-files-found: error

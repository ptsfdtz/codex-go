name: AgentDeck CI
on:
  push:
    branches: ['**', '!release']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host-windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: desktop/core
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm schema:verify
      - run: pnpm audit --prod
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: pnpm --filter @agentdeck/web test
      - run: pnpm --filter @agentdeck/web exec playwright install msedge
      - run: node web/tests/browser-transport.mjs
      - run: node web/tests/browser-recovery.mjs
      - run: node web/tests/browser-pwa.mjs
      - run: node web/tests/browser-mobile.mjs
      - run: node web/tests/browser-motion.mjs
      - run: node web/tests/browser-diff.mjs
      - run: node web/tests/browser-chat.mjs
      - run: node web/tests/browser-workspaces-auto.mjs
      - run: node web/tests/browser-questions.mjs
      - run: node web/tests/browser-plan.mjs
      - run: pnpm --filter @agentdeck/web build
      - run: pnpm host:package
        env:
          AGENTDECK_RELEASE_VERSION: host-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/host-downloads/
          if-no-files-found: error
  host-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core
      - run: sh -n scripts/host/install.sh scripts/host/start.sh
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml --lib --test host_lifecycle
      - run: node scripts/host/package.mjs
        env:
          AGENTDECK_RELEASE_VERSION: host-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: artifacts/host-downloads/
          if-no-files-found: error

name: AgentDeck CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/core
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm schema:verify
      - run: pnpm audit --prod
      - run: pnpm desktop:prepare
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml -- --check
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: pnpm --filter @agentdeck/desktop test
      - run: cargo test --locked --manifest-path desktop/src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path desktop/src-tauri/Cargo.toml -- -D warnings
      - run: pnpm --filter @agentdeck/desktop exec playwright install msedge
      - run: pnpm --filter @agentdeck/desktop exec playwright test
      - run: pnpm desktop:build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentdeck-tauri-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            artifacts/tauri-*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
        working-directory: android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/test-results/

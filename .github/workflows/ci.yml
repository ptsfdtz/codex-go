name: AgentDeck CI
on:
  push:
    branches: ['**', '!release']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  host-windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: desktop/core
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - run: pnpm schema:verify
      - run: pnpm audit --prod
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: pnpm --filter @agentdeck/web test
      - run: pnpm --filter @agentdeck/web exec playwright install msedge
      - run: node web/tests/browser-transport.mjs
      - run: node web/tests/browser-recovery.mjs
      - run: node web/tests/browser-pwa.mjs
      - run: node web/tests/browser-mobile.mjs
      - run: node web/tests/browser-motion.mjs
      - run: pnpm --filter @agentdeck/web build
      - run: pnpm host:package
        env:
          AGENTDECK_RELEASE_VERSION: host-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: artifacts/host-downloads/
          if-no-files-found: error
  host-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/core
      - run: sh -n scripts/host/install.sh scripts/host/start.sh
      - run: cargo fmt --manifest-path desktop/core/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path desktop/core/Cargo.toml --lib --test host_lifecycle
      - run: node scripts/host/package.mjs
        env:
          AGENTDECK_RELEASE_VERSION: host-${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: artifacts/host-downloads/
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable Android update signing key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.AGENTDECK_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$UPDATE_SIGNING_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - run: chmod +x gradlew
        working-directory: android
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest -PagentdeckVersionCode=$((1000 + GITHUB_RUN_NUMBER))
        working-directory: android
      - name: Prepare Android download
        env:
          AGENTDECK_RELEASE_VERSION: host-${{ github.sha }}
          UPDATE_SIGNING_KEY: ${{ secrets.AGENTDECK_ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk release-assets/AgentDeck-android-debug.apk
          if [ -n "$UPDATE_SIGNING_KEY" ]; then
            node scripts/updates/package-android.mjs android/app/build/outputs/apk/debug release-assets
          else
            echo 'Update feed omitted: configure a stable signing key for data-preserving Android updates.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/app/build/test-results/

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AgentDeck 管理</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>AgentDeck <span>管理</span></h1>
      <div id="identity"></div>
    </header>
    <main>
      <div id="notice" role="alert" hidden></div>
      <section id="login" class="card narrow" hidden>
        <h2>管理员登录</h2>
        <form id="login-form">
          <label
            >用户名<input name="username" autocomplete="username" required maxlength="80"
          /></label>
          <label
            >密码<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="1024"
          /></label>
          <button type="submit">登录</button>
        </form>
      </section>
      <section id="password" class="card narrow" hidden>
        <h2>修改密码</h2>
        <p>初次登录需要修改临时密码。修改后，所有设备需要重新登录。</p>
        <form id="password-form">
          <label
            >当前密码<input
              name="oldPassword"
              type="password"
              autocomplete="current-password"
              required
          /></label>
          <label
            >新密码<input
              name="newPassword"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="1024"
          /></label>
          <label
            >确认新密码<input
              name="confirm"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="1024"
          /></label>
          <button type="submit">保存并重新登录</button
          ><button type="button" id="cancel-password" class="secondary">取消</button>
        </form>
      </section>
      <section id="management" hidden>
        <div class="toolbar">
          <nav aria-label="管理内容">
            <button data-tab="accounts">账户</button><button data-tab="devices">设备</button
            ><button data-tab="audit">管理记录</button>
          </nav>
          <button id="refresh" class="secondary">刷新</button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
        <section id="accounts" class="card">
          <div class="section-title">
            <h2>账户</h2>
            <button id="create-account">创建账户</button>
          </div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>用户名</th>
                  <th>状态</th>
                  <th>设备与连接配额</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="account-rows"></tbody>
            </table>
          </div>
        </section>
        <section id="devices" class="card" hidden>
          <h2>设备</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>名称</th>
                  <th>账户</th>
                  <th>类型</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="device-rows"></tbody>
            </table>
          </div>
        </section>
        <section id="audit" class="card" hidden>
          <h2>最近管理记录</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th>时间</th>
                  <th>操作者</th>
                  <th>操作</th>
                  <th>目标</th>
                </tr>
              </thead>
              <tbody id="audit-rows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <dialog id="editor">
      <form id="editor-form">
        <h2 id="editor-title"></h2>
        <div id="editor-fields"></div>
        <div class="actions">
          <button type="button" id="editor-cancel" class="secondary">取消</button
          ><button type="submit">保存</button>
        </div>
      </form>
    </dialog>
    <dialog id="secret">
      <h2 id="secret-title"></h2>
      <p>临时密码只在本次显示。请通过可信方式交给用户；首次登录必须修改。</p>
      <output id="secret-value"></output>
      <div class="actions">
        <button id="secret-copy" class="secondary">复制</button
        ><button id="secret-close">已保存</button>
      </div>
    </dialog>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="AgentDeck 管理">AgentDeck 管理</title>
    <link rel="stylesheet" href="/admin/style.css" />
    <script src="/admin/i18n.js" defer></script>
    <script src="/admin/app.js" defer></script>
  </head>
  <body>
    <header>
      <h1>AgentDeck <span data-i18n="管理">管理</span></h1>
      <select id="language" aria-label="Language">
        <option value="system">System / 跟随系统</option>
        <option value="zh-CN">简体中文</option>
        <option value="en">English</option>
      </select>
      <div id="identity"></div>
    </header>
    <main>
      <div id="notice" role="alert" hidden></div>
      <section id="login" class="card narrow" hidden>
        <h2><span data-i18n="管理员登录">管理员登录</span></h2>
        <form id="login-form">
          <label
            ><span data-i18n="用户名">用户名</span
            ><input name="username" autocomplete="username" required maxlength="80"
          /></label>
          <label
            ><span data-i18n="密码">密码</span
            ><input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="1024"
          /></label>
          <button type="submit"><span data-i18n="登录">登录</span></button>
        </form>
      </section>
      <section id="password" class="card narrow" hidden>
        <h2><span data-i18n="修改密码">修改密码</span></h2>
        <p>
          <span data-i18n="初次登录需要修改临时密码。修改后，所有设备需要重新登录。"
            >初次登录需要修改临时密码。修改后，所有设备需要重新登录。</span
          >
        </p>
        <form id="password-form">
          <label
            ><span data-i18n="当前密码">当前密码</span
            ><input name="oldPassword" type="password" autocomplete="current-password" required
          /></label>
          <label
            ><span data-i18n="新密码">新密码</span
            ><input
              name="newPassword"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="1024"
          /></label>
          <label
            ><span data-i18n="确认新密码">确认新密码</span
            ><input
              name="confirm"
              type="password"
              autocomplete="new-password"
              required
              minlength="12"
              maxlength="1024"
          /></label>
          <button type="submit"><span data-i18n="保存并重新登录">保存并重新登录</span></button
          ><button type="button" id="cancel-password" class="secondary">
            <span data-i18n="取消">取消</span>
          </button>
        </form>
      </section>
      <section id="management" hidden>
        <div class="toolbar">
          <nav data-i18n-aria-label="管理内容" aria-label="管理内容">
            <button data-tab="accounts"><span data-i18n="账户">账户</span></button
            ><button data-tab="devices"><span data-i18n="设备">设备</span></button
            ><button data-tab="audit"><span data-i18n="管理记录">管理记录</span></button>
          </nav>
          <button id="refresh" class="secondary"><span data-i18n="刷新">刷新</span></button>
        </div>
        <div id="status" class="status" aria-live="polite"></div>
        <section id="accounts" class="card">
          <div class="section-title">
            <h2><span data-i18n="账户">账户</span></h2>
            <button id="create-account"><span data-i18n="创建账户">创建账户</span></button>
          </div>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th><span data-i18n="用户名">用户名</span></th>
                  <th><span data-i18n="状态">状态</span></th>
                  <th><span data-i18n="设备与连接配额">设备与连接配额</span></th>
                  <th><span data-i18n="操作">操作</span></th>
                </tr>
              </thead>
              <tbody id="account-rows"></tbody>
            </table>
          </div>
        </section>
        <section id="devices" class="card" hidden>
          <h2><span data-i18n="设备">设备</span></h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th><span data-i18n="名称">名称</span></th>
                  <th><span data-i18n="账户">账户</span></th>
                  <th><span data-i18n="类型">类型</span></th>
                  <th><span data-i18n="状态">状态</span></th>
                  <th><span data-i18n="操作">操作</span></th>
                </tr>
              </thead>
              <tbody id="device-rows"></tbody>
            </table>
          </div>
        </section>
        <section id="audit" class="card" hidden>
          <h2><span data-i18n="最近管理记录">最近管理记录</span></h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th><span data-i18n="时间">时间</span></th>
                  <th><span data-i18n="操作者">操作者</span></th>
                  <th><span data-i18n="操作">操作</span></th>
                  <th><span data-i18n="目标">目标</span></th>
                </tr>
              </thead>
              <tbody id="audit-rows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
    <dialog id="editor">
      <form id="editor-form">
        <h2 id="editor-title"></h2>
        <div id="editor-fields"></div>
        <div class="actions">
          <button type="button" id="editor-cancel" class="secondary">
            <span data-i18n="取消">取消</span></button
          ><button type="submit"><span data-i18n="保存">保存</span></button>
        </div>
      </form>
    </dialog>
    <dialog id="secret">
      <h2 id="secret-title"></h2>
      <p>
        <span data-i18n="临时密码只在本次显示。请通过可信方式交给用户；首次登录必须修改。"
          >临时密码只在本次显示。请通过可信方式交给用户；首次登录必须修改。</span
        >
      </p>
      <output id="secret-value"></output>
      <div class="actions">
        <button id="secret-copy" class="secondary"><span data-i18n="复制">复制</span></button
        ><button id="secret-close"><span data-i18n="已保存">已保存</span></button>
      </div>
    </dialog>
  </body>
</html>

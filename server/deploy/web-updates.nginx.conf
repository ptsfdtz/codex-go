# Include inside the existing Web HTTPS server block, using its Web document root.
# Revalidate the worker and install manifest; never cache the build update pointer.
location = /version.json {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}
location = /sw.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

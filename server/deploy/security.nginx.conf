# Include in the HTTPS server block, before broad application/static locations.
# Keep configuration, credentials and database backups out of public roots too.
# ACME challenges under /.well-known/ remain available.
location ~ (^|/)\.(?!well-known(?:/|$)) {
    return 404;
}
location ~* (^|/)(cloud\.env|release\.env|[^/]*\.(dump|sql|sqlite3?|db|key|pem|pfx|p12|jks|keystore|pgpass))($|/) {
    return 404;
}

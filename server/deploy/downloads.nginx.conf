# Include inside the existing HTTPS server block. Do not replace API/WebSocket routes.
# Publish artifacts/host-downloads contents to /opt/agentdeck/downloads first.
location = /install.sh {
    root /opt/agentdeck/downloads;
    default_type text/plain;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location = /install.ps1 {
    root /opt/agentdeck/downloads;
    default_type text/plain;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location = /install-codex.ps1 {
    root /opt/agentdeck/downloads;
    default_type text/plain;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location = /releases/stable.txt {
    root /opt/agentdeck/downloads;
    default_type text/plain;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location = /android/stable.json {
    root /opt/agentdeck/downloads;
    default_type application/json;
    add_header Cache-Control "no-store";
    try_files $uri =404;
}
location ^~ /releases/ {
    root /opt/agentdeck/downloads;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

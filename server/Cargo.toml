[package]
name = "agentdeck-cloud"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
default-run = "agentdeck-cloud"

[dependencies]
agentdeck-connection-protocol = { path = "../packages/connection-protocol" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"
argon2 = "0.5"
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rpassword = "7"

aes-gcm = "0.10"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
lto = "thin"
strip = true
